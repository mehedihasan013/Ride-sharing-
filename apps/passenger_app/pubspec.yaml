name: cholobhairab_passenger
description: "CholoBhairab Passenger App - Real-Time InDrive Bidding Ride Sharing for Bhairab, Bangladesh"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cholo_ui:
    path: ../../packages/cholo_ui
  socket_io_client: ^2.0.3+1
  http: ^1.2.1
  provider: ^6.1.2
  material_ui: ^1.11.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
